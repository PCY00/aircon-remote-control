<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <style>
      .title { font: 700 36px 'Segoe UI', 'Malgun Gothic', sans-serif; fill: #111827; }
      .subtitle { font: 500 19px 'Segoe UI', 'Malgun Gothic', sans-serif; fill: #475569; }
      .label { font: 700 22px 'Segoe UI', 'Malgun Gothic', sans-serif; fill: #111827; }
      .small { font: 600 17px 'Segoe UI', 'Malgun Gothic', sans-serif; fill: #334155; }
      .pin { font: 700 19px 'Segoe UI', 'Malgun Gothic', sans-serif; fill: #ffffff; }
      .note { font: 700 20px 'Segoe UI', 'Malgun Gothic', sans-serif; fill: #0f172a; }
      .wire5 { stroke: #ef233c; stroke-width: 9; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wireg { stroke: #111827; stroke-width: 9; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wires { stroke: #10b981; stroke-width: 9; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #334155; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1400" height="820" fill="#f5f7fb"/>
  <text x="54" y="62" class="title">ESP32-H2 SuperMini → 940 nm IR LED 송신 회로</text>
  <text x="54" y="96" class="subtitle">USB 전원 사용 · GPIO5 기준 · AO3400A 로우사이드 스위칭</text>

  <!-- board -->
  <g filter="url(#shadow)">
    <rect x="55" y="145" width="285" height="565" rx="28" fill="#176a9e"/>
    <rect x="101" y="171" width="193" height="82" rx="13" fill="#d7dde4"/>
    <rect x="124" y="184" width="147" height="55" rx="7" fill="#20252b"/>
    <rect x="91" y="286" width="213" height="275" rx="18" fill="#0f5785" stroke="#80c7ec" stroke-width="3"/>
    <rect x="131" y="329" width="133" height="133" rx="14" fill="#223042"/>
    <circle cx="197" cy="395" r="36" fill="#111827"/>
    <text x="197" y="490" text-anchor="middle" class="pin">ESP32-H2</text>
    <text x="197" y="520" text-anchor="middle" class="pin">SuperMini</text>

    <rect x="265" y="272" width="75" height="46" rx="8" fill="#ef233c"/>
    <text x="302" y="302" text-anchor="middle" class="pin">5V</text>
    <rect x="265" y="390" width="75" height="46" rx="8" fill="#111827"/>
    <text x="302" y="420" text-anchor="middle" class="pin">GND</text>
    <rect x="265" y="590" width="75" height="46" rx="8" fill="#10b981"/>
    <text x="302" y="620" text-anchor="middle" class="pin">GPIO5</text>
  </g>

  <!-- 5V branch -->
  <path class="wire5" d="M340 295 H462 H515"/>
  <circle cx="462" cy="295" r="10" fill="#ef233c"/>

  <!-- 47 ohm resistor -->
  <rect x="515" y="272" width="132" height="46" rx="11" fill="#ffffff" stroke="#ef233c" stroke-width="5"/>
  <path d="M530 295 l14 -13 l18 26 l18 -26 l18 26 l18 -26 l16 13" stroke="#b91c1c" stroke-width="4" fill="none"/>
  <text x="581" y="257" text-anchor="middle" class="label">47 Ω</text>
  <path class="wire5" d="M647 295 H745"/>

  <!-- IR LED package -->
  <g filter="url(#shadow)">
    <rect x="745" y="236" width="155" height="118" rx="22" fill="#ffffff"/>
    <line x1="745" y1="295" x2="785" y2="295" class="wire5"/>
    <ellipse cx="822" cy="295" rx="29" ry="43" fill="#2f93d1" stroke="#175985" stroke-width="5"/>
    <path d="M810 257 q31 25 0 75" fill="#89cff0" opacity="0.72"/>
    <line x1="851" y1="295" x2="900" y2="295" class="wireg"/>
    <text x="822" y="382" text-anchor="middle" class="label">940 nm IR LED</text>
    <text x="776" y="222" text-anchor="middle" class="small">A (+)</text>
    <text x="872" y="222" text-anchor="middle" class="small">K (−)</text>
  </g>

  <!-- MOSFET -->
  <g filter="url(#shadow)">
    <rect x="965" y="225" width="175" height="255" rx="25" fill="#20242a"/>
    <text x="1052" y="274" text-anchor="middle" class="pin">AO3400A</text>
    <text x="1052" y="305" text-anchor="middle" class="pin">N-MOSFET</text>
    <circle cx="965" cy="385" r="10" fill="#10b981"/>
    <circle cx="1052" cy="225" r="10" fill="#111827"/>
    <circle cx="1052" cy="480" r="10" fill="#111827"/>
    <text x="1016" y="346" class="pin">D</text>
    <text x="986" y="407" class="pin">G</text>
    <text x="1017" y="450" class="pin">S</text>
    <path d="M1052 225 V337 M1052 393 V480 M965 385 H1018 M1018 337 V424" stroke="#e5e7eb" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
  <path class="wireg" d="M900 295 H930 V225 H1052"/>

  <!-- GND rail -->
  <path class="wireg" d="M340 413 H462 H1052 V480"/>
  <circle cx="462" cy="413" r="10" fill="#111827"/>
  <circle cx="1052" cy="413" r="10" fill="#111827"/>
  <text x="497" y="448" class="label">공통 GND</text>

  <!-- 100nF capacitor, explicitly between 5V and GND -->
  <path class="wire5" d="M462 295 V333"/>
  <line x1="420" y1="339" x2="504" y2="339" stroke="#31506e" stroke-width="9" stroke-linecap="round"/>
  <line x1="420" y1="367" x2="504" y2="367" stroke="#31506e" stroke-width="9" stroke-linecap="round"/>
  <path class="wireg" d="M462 373 V413"/>
  <text x="393" y="358" text-anchor="end" class="label">100 nF</text>
  <text x="393" y="386" text-anchor="end" class="small">세라믹 · 극성 없음</text>
  <rect x="358" y="472" width="254" height="64" rx="15" fill="#fff4d6" stroke="#f59e0b" stroke-width="3"/>
  <text x="485" y="499" text-anchor="middle" class="note">100nF은 5V와 GND 사이</text>
  <text x="485" y="524" text-anchor="middle" class="small">병렬로 바로 연결</text>
  <path d="M455 472 L462 420" stroke="#f59e0b" stroke-width="4" fill="none"/>

  <!-- GPIO gate branch -->
  <path class="wires" d="M340 613 H620"/>
  <rect x="620" y="590" width="142" height="46" rx="11" fill="#ffffff" stroke="#10b981" stroke-width="5"/>
  <path d="M636 613 l14 -13 l18 26 l18 -26 l18 26 l18 -26 l22 13" stroke="#047857" stroke-width="4" fill="none"/>
  <text x="691" y="575" text-anchor="middle" class="label">100 Ω</text>
  <path class="wires" d="M762 613 H910 V385 H965"/>
  <circle cx="910" cy="385" r="10" fill="#10b981"/>

  <!-- Gate pulldown -->
  <path class="thin" d="M910 385 V417"/>
  <rect x="887" y="417" width="46" height="117" rx="10" fill="#ffffff" stroke="#334155" stroke-width="4"/>
  <path d="M910 430 l-13 12 l26 15 l-26 15 l26 15 l-26 15 l13 17" stroke="#334155" stroke-width="4" fill="none"/>
  <path class="wireg" d="M910 534 V548 H1052 V413"/>
  <text x="866" y="477" text-anchor="end" class="label">100 kΩ</text>
  <text x="866" y="502" text-anchor="end" class="small">Gate → GND</text>

  <!-- bottom callouts -->
  <g>
    <rect x="55" y="744" width="1290" height="52" rx="15" fill="#e8eef7"/>
    <text x="79" y="777" class="note">연결 순서:</text>
    <text x="209" y="777" class="small">5V → 47Ω → LED A / LED K → D · S → GND · GPIO5 → 100Ω → G · G → 100kΩ → GND</text>
  </g>
</svg>
