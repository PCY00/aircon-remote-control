# Mosquitto topic ACL. Once an acl_file is active, every topic that is not
# listed here is denied for every client, so each broker identity gets only the
# access it needs. Reload with `docker kill --signal=HUP aircon-mosquitto` after
# changing this file or the password file.

# Zigbee2MQTT owns its whole base topic (device reports, bridge requests/responses).
user zigbee2mqtt
topic readwrite zigbee2mqtt/#

# The Pi web app (aircon-controller) reads reports and bridge state, sends device
# set requests (H2 IR commands) and opens/closes joining. It cannot rename or
# remove devices, change bridge options or publish fake sensor reports.
user aircon-controller
topic read zigbee2mqtt/#
topic write zigbee2mqtt/+/set
topic write zigbee2mqtt/bridge/request/permit_join
