import groovy.json.JsonSlurper
import groovy.json.JsonOutput
plugins { id 'com.android.application' }
def privateConfig = new JsonSlurper().parse(rootProject.file('private-build.json'))
android {
    namespace 'com.aircon.family'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'com.aircon.family'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ['FIREBASE_APP_ID','FIREBASE_API_KEY','FIREBASE_PROJECT_ID','FIREBASE_SENDER_ID','GOOGLE_WEB_CLIENT_ID'].each {
            buildConfigField 'String', it, JsonOutput.toJson(privateConfig[it])
        }
    }
    signingConfigs {
        family {
            storeFile file(privateConfig.signing_file)
            storePassword file(privateConfig.signing_password_file).text.trim()
            keyAlias 'family-app'
            keyPassword storePassword
        }
    }
    flavorDimensions += 'environment'
    productFlavors {
        production { dimension 'environment' }
        fixture { dimension 'environment'; applicationIdSuffix '.fixture'; versionNameSuffix '-fixture' }
    }
    buildTypes {
        debug { signingConfig signingConfigs.family }
        release { signingConfig signingConfigs.family; minifyEnabled false }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
